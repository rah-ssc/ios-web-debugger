<!DOCTYPE html>
<html>
<head>
    <title>iOS Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #1e1e1e; color: #fff; }
        .device { border: 1px solid #444; padding: 15px; margin: 10px 0; border-radius: 8px; background: #2d2d2d; }
        .serial { font-family: monospace; color: #6a9fb5; }
        
        /* Tab Navigation */
        .tab-nav {
            display: flex;
            gap: 10px;
            margin: 20px 0 10px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }
        .tab-btn {
            background: #2d2d2d;
            color: #fff;
            border: 1px solid #444;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        .tab-btn.active {
            background: #4a9eff;
            border-color: #4a9eff;
        }
        
        /* Console Styling */
        .console, .network {
            background: #0d0d0d;
            color: #f8f8f2;
            padding: 15px;
            margin-top: 10px;
            border-radius: 8px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            height: 400px;
            overflow-y: auto;
            border: 1px solid #444;
        }
        .network {
            display: none;
        }
        
        .log { color: #f8f8f2; }
        .warn { color: #ffb86c; }
        .error { color: #ff5555; }
        .info { color: #8be9fd; }
        
        /* Network Request Styling */
        .network-request {
            padding: 8px;
            margin: 4px 0;
            border-left: 3px solid #4a9eff;
            background: #1a1a1a;
            font-size: 12px;
        }
        .network-request:hover {
            background: #252525;
        }
        .req-method {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
            margin-right: 10px;
            min-width: 60px;
            text-align: center;
        }
        .method-GET { background: #61affe; color: white; }
        .method-POST { background: #49cc90; color: white; }
        .method-PUT { background: #fca130; color: white; }
        .method-DELETE { background: #f93e3e; color: white; }
        .status-success { color: #49cc90; }
        .status-warning { color: #fca130; }
        .status-error { color: #f93e3e; }
        .req-url {
            color: #8be9fd;
            word-break: break-all;
        }
        .req-type {
            color: #bd93f9;
            margin-left: 10px;
            font-size: 11px;
        }
        
        button { 
            background: #4a9eff; 
            color: white; 
            border: none; 
            padding: 8px 16px; 
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #6aafff; }
        
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .connected { background: #28a745; color: white; }
        .disconnected { background: #dc3545; color: white; }
        
        .stats {
            display: flex;
            gap: 20px;
            margin: 10px 0;
            color: #aaa;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>📱 iOS Web Inspector Debugger</h1>
    
    <div>
        <button onclick="listDevices()">🔍 List iOS Devices</button>
        <button onclick="clearConsole()">🧹 Clear Console</button>
        <button onclick="clearNetwork()">📡 Clear Network</button>
    </div>
    
    <div id="deviceList"></div>
    
    <!-- Tab Navigation -->
    <div class="tab-nav">
        <button id="tab-console-btn" class="tab-btn active" onclick="switchTab('console')">📋 Console</button>
        <button id="tab-network-btn" class="tab-btn" onclick="switchTab('network')">🌐 Network</button>
    </div>
    
    <!-- Console Tab -->
    <div id="console" class="console">
        <div style="color: #6a9fb5;">⏳ Waiting for device connection...</div>
    </div>
    
    <!-- Network Tab -->
    <div id="network" class="network">
        <div class="stats">
            <span>📊 Total Requests: <span id="request-count">0</span></span>
            <span>✅ Success: <span id="success-count">0</span></span>
            <span>⚠️ Warnings: <span id="warning-count">0</span></span>
            <span>❌ Errors: <span id="error-count">0</span></span>
        </div>
        <div id="network-requests"></div>
    </div>
    
    <h3>📡 Raw Protocol Messages:</h3>
    <pre id="output" style="background: #0d0d0d; color: #ccc; padding: 10px; height: 200px; overflow-y: auto;"></pre>

    <script>
        const ws = new WebSocket('ws://localhost:9223/ws');
        const consoleOutput = document.getElementById('console');
        const networkRequests = document.getElementById('network-requests');
        const output = document.getElementById('output');
        const deviceList = document.getElementById('deviceList');
        
        // Network request tracking
        let requests = [];
        let requestStats = { total: 0, success: 0, warning: 0, error: 0 };
        
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            output.innerHTML += '\n📨 ' + JSON.stringify(data, null, 2).substring(0, 500);
            output.scrollTop = output.scrollHeight;
            
            switch(data.type) {
                case 'devices':
                    updateDeviceList(data.data);
                    break;
                case 'console':
                    // Check if it's a network message
                    if (data.data.includes('🌐➡️') || data.data.includes('🌐⬅️')) {
                        addNetworkRequest(data.data, data.serial);
                    } else {
                        addConsoleLog(data.data, data.serial);
                    }
                    break;
                case 'connected':
                    addConsoleLog(`✅ ${data.data}`, data.serial, 'info');
                    break;
                case 'disconnected':
                    addConsoleLog(`❌ ${data.data}`, data.serial, 'error');
                    break;
                case 'error':
                    addConsoleLog(`⚠️ ${data.data}`, null, 'error');
                    break;
                case 'info':
                    addConsoleLog(`ℹ️ ${data.data}`, null, 'info');
                    break;
                default:
                    if (data.data) {
                        addConsoleLog(data.data, data.serial);
                    }
            }
        };
        
        ws.onopen = () => {
            addConsoleLog('🔌 Connected to iOS Debug Companion', null, 'info');
        };
        
        function switchTab(tab) {
            const consoleEl = document.getElementById('console');
            const networkEl = document.getElementById('network');
            const consoleBtn = document.getElementById('tab-console-btn');
            const networkBtn = document.getElementById('tab-network-btn');
            
            if (tab === 'console') {
                consoleEl.style.display = 'block';
                networkEl.style.display = 'none';
                consoleBtn.classList.add('active');
                networkBtn.classList.remove('active');
            } else {
                consoleEl.style.display = 'none';
                networkEl.style.display = 'block';
                consoleBtn.classList.remove('active');
                networkBtn.classList.add('active');
            }
        }
        
        function addNetworkRequest(message, deviceSerial) {
            // Parse network message
            let emoji = '';
            let method = '';
            let url = '';
            let status = '';
            
            if (message.includes('🌐➡️')) {
                // Request: 🌐➡️ GET https://example.com
                const parts = message.replace('🌐➡️', '').trim().split(' ');
                method = parts[0];
                url = parts.slice(1).join(' ');
                emoji = '⬆️';
            } else if (message.includes('🌐⬅️')) {
                // Response: 🌐⬅️ ✅ 200 https://example.com
                const parts = message.replace('🌐⬅️', '').trim().split(' ');
                emoji = parts[0]; // ✅, ⚠️, ❌
                status = parts[1];
                url = parts.slice(2).join(' ');
                method = 'RESPONSE';
                
                // Update stats
                requestStats.total++;
                if (status >= 200 && status < 300) requestStats.success++;
                else if (status >= 400 && status < 500) requestStats.warning++;
                else if (status >= 500) requestStats.error++;
                
                updateStats();
            }
            
            const requestEl = document.createElement('div');
            requestEl.className = 'network-request';
            
            const timestamp = new Date().toLocaleTimeString();
            let methodClass = '';
            if (method === 'GET') methodClass = 'method-GET';
            if (method === 'POST') methodClass = 'method-POST';
            if (method === 'PUT') methodClass = 'method-PUT';
            if (method === 'DELETE') methodClass = 'method-DELETE';
            
            requestEl.innerHTML = `
                <div style="display: flex; align-items: center; flex-wrap: wrap;">
                    <span class="req-method ${methodClass}">${method}</span>
                    <span style="color: #888;">[${timestamp}]</span>
                    ${deviceSerial ? `<span style="color: #6a9fb5; margin-left: 10px;">[${deviceSerial.substr(0, 8)}]</span>` : ''}
                    <span style="margin-left: 10px;">${emoji}</span>
                    ${status ? `<span style="margin-left: 10px; font-weight: bold;" class="${status >= 400 ? 'status-error' : 'status-success'}">${status}</span>` : ''}
                    <span class="req-url" style="margin-left: 10px;">${url}</span>
                </div>
            `;
            
            networkRequests.appendChild(requestEl);
            networkRequests.scrollTop = networkRequests.scrollHeight;
            
            // Keep last 100 requests
            requests.push(requestEl);
            if (requests.length > 100) {
                const oldRequest = requests.shift();
                if (oldRequest.parentNode) {
                    oldRequest.remove();
                }
            }
        }
        
        function updateStats() {
            document.getElementById('request-count').textContent = requestStats.total;
            document.getElementById('success-count').textContent = requestStats.success;
            document.getElementById('warning-count').textContent = requestStats.warning;
            document.getElementById('error-count').textContent = requestStats.error;
        }
        
        function addConsoleLog(message, deviceSerial, type = 'log') {
            const div = document.createElement('div');
            div.className = type;
            const timestamp = new Date().toLocaleTimeString();
            
            // Don't add network messages to console
            if (message.includes('🌐➡️') || message.includes('🌐⬅️')) {
                return;
            }
            
            div.innerHTML = `[${timestamp}] ${deviceSerial ? `<span style="color: #6a9fb5;">[${deviceSerial.substr(0, 8)}]</span> ` : ''}${message}`;
            consoleOutput.appendChild(div);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }
        
        function updateDeviceList(devices) {
            deviceList.innerHTML = '<h3>📱 Connected iOS Devices:</h3>';
            
            if (devices.length === 0) {
                deviceList.innerHTML += '<p>No iOS devices found. Connect via USB and enable Web Inspector.</p>';
                return;
            }
            
            devices.forEach(device => {
                const div = document.createElement('div');
                div.className = 'device';
                div.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <strong>${device.serial.substring(0, 12)}...</strong>
                            <span class="serial">(${device.connection})</span>
                        </div>
                        <span class="status-badge disconnected" id="status-${device.serial}">🔴 Disconnected</span>
                    </div>
                    <div style="margin-top: 10px;">
                        <button onclick="connectToDevice('${device.serial}')" id="connect-${device.serial}">
                            🔌 Connect Web Inspector
                        </button>
                        <button onclick="disconnectDevice('${device.serial}')" id="disconnect-${device.serial}" style="display: none;">
                            ❌ Disconnect
                        </button>
                    </div>
                    <div style="margin-top: 5px; color: #aaa; font-size: 12px;">
                        Web Inspector: <span style="color: #ffb86c;">Enable in iOS Settings → Safari → Advanced</span>
                    </div>
                `;
                deviceList.appendChild(div);
            });
        }
        
        function connectToDevice(serial) {
            addConsoleLog(`🔌 Connecting to ${serial.substr(0, 8)}...`, null, 'info');
            ws.send(JSON.stringify({
                command: 'connect',
                serial: serial
            }));
            
            document.getElementById(`connect-${serial}`).style.display = 'none';
            document.getElementById(`disconnect-${serial}`).style.display = 'inline-block';
            const status = document.getElementById(`status-${serial}`);
            status.innerHTML = '🟢 Connected';
            status.className = 'status-badge connected';
        }
        
        function disconnectDevice(serial) {
            ws.send(JSON.stringify({
                command: 'disconnect',
                serial: serial
            }));
            
            document.getElementById(`connect-${serial}`).style.display = 'inline-block';
            document.getElementById(`disconnect-${serial}`).style.display = 'none';
            const status = document.getElementById(`status-${serial}`);
            status.innerHTML = '🔴 Disconnected';
            status.className = 'status-badge disconnected';
        }
        
        function listDevices() {
            ws.send(JSON.stringify({command: 'refreshDevices'}));
        }
        
        function clearConsole() {
            consoleOutput.innerHTML = '<div style="color: #6a9fb5;">Console cleared.</div>';
        }
        
        function clearNetwork() {
            networkRequests.innerHTML = '';
            requests = [];
            requestStats = { total: 0, success: 0, warning: 0, error: 0 };
            updateStats();
        }
        
        // Auto-refresh device list every 30 seconds
        setInterval(listDevices, 30000);
    </script>
</body>
</html>
